<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>AIR Team 工作檢視</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <div>
          <h1>CGU AIR Team 服務狀態總覽</h1>
        </div>
      </header>

      <section class="summary-grid" aria-label="工作摘要">
        <article class="summary-card summary-card-primary">
          <span class="summary-label">立案</span>
          <strong id="visible-count">—</strong>
          <span class="summary-caption">筆立案需求</span>
        </article>
        <article class="summary-card">
          <span class="summary-label">處理中</span>
          <strong id="active-count">—</strong>
          <span class="summary-caption">正在進行的項目</span>
        </article>
        <article class="summary-card">
          <span class="summary-label">已結案</span>
          <strong id="closed-count">—</strong>
          <span class="summary-caption">完成的項目</span>
        </article>
      </section>

      <section class="leaderboard-panel" aria-labelledby="leaderboard-title">
        <h2 id="leaderboard-title"><button id="leaderboard-toggle" class="leaderboard-toggle" type="button" aria-expanded="false" aria-controls="leaderboard-content">AIR Team 服務積分排行榜 <span class="leaderboard-chevron" aria-hidden="true"></span></button></h2>
        <div id="leaderboard-content" class="leaderboard-content" hidden>
          <ol id="leaderboard-list" class="leaderboard-list"></ol>
        </div>
      </section>

      <section class="workspace-panel">
        <div class="toolbar">
          <div class="toolbar-heading">
            <h2>需求清單</h2>
            <span id="result-count" class="result-count"></span>
          </div>
          <div class="toolbar-controls">
            <label class="search-box">
              <span class="sr-only">搜尋需求</span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35m1.35-5.65a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z" /></svg>
              <input id="search-input" type="search" placeholder="搜尋標題或系所" autocomplete="off" />
            </label>
            <label class="select-wrap">
              <span class="sr-only">篩選狀態</span>
              <select id="status-filter"><option value="all">所有狀態</option></select>
            </label>
            <button id="refresh-button" class="refresh-button" type="button" title="重新載入資料">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8.1 8.1 0 0 0-14.8-3.9L3 10m0-5v5h5M4 13a8.1 8.1 0 0 0 14.8 3.9L21 14m0 5v-5h-5" /></svg>
              <span>重新整理</span>
            </button>
          </div>
        </div>

        <div id="status-message" class="status-message" role="status" hidden></div>
        <div id="loading-state" class="loading-state" aria-live="polite"><span class="spinner"></span> 正在載入工作資料…</div>
        <div id="tables-container" hidden>
          <section class="table-section" aria-labelledby="active-table-title">
            <div class="table-section-heading">
              <h3 id="active-table-title" class="table-section-title">未結案</h3>
              <span id="active-table-count" class="result-count"></span>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th class="status-column" data-sort-column="status"><button class="sort-button" data-sort-key="status" type="button">狀態 <span class="sort-indicator" aria-hidden="true"></span></button></th>
                    <th class="service-count-column" data-sort-column="serviceCount"><button class="sort-button" data-sort-key="serviceCount" type="button">服務人數 <span class="sort-indicator" aria-hidden="true"></span></button></th>
                    <th class="computer-count-column" data-sort-column="computerCount"><button class="sort-button" data-sort-key="computerCount" type="button">電腦數 <span class="sort-indicator" aria-hidden="true"></span></button></th>
                    <th class="colleague-column" data-sort-column="colleague"><button class="sort-button" data-sort-key="colleague" type="button">同仁 <span class="sort-indicator" aria-hidden="true"></span></button></th>
                    <th data-sort-column="department"><button class="sort-button" data-sort-key="department" type="button">需求者系所 <span class="sort-indicator" aria-hidden="true"></span></button></th>
                    <th class="title-column" data-sort-column="title"><button class="sort-button" data-sort-key="title" type="button">標題 <span class="sort-indicator" aria-hidden="true"></span></button></th>
                    <th class="assignee-column" data-sort-column="assignees"><button class="sort-button" data-sort-key="assignees" type="button">承辦人 <span class="sort-indicator" aria-hidden="true"></span></button></th>
                    <th class="date-column" data-sort-column="date"><button class="sort-button" data-sort-key="date" type="button">立案日 <span class="sort-indicator" aria-hidden="true"></span></button></th>
                    <th class="date-column" data-sort-column="expectedDate"><button class="sort-button" data-sort-key="expectedDate" type="button">預完日 <span class="sort-indicator" aria-hidden="true"></span></button></th>
                    <th class="date-column" data-sort-column="closeDate"><button class="sort-button" data-sort-key="closeDate" type="button">結案日 <span class="sort-indicator" aria-hidden="true"></span></button></th>
                  </tr>
                </thead>
                <tbody id="active-work-table-body"></tbody>
              </table>
              <div id="active-empty-state" class="empty-state" hidden>
                <div class="empty-icon">⌕</div>
                <h3>沒有符合條件的未結案項目</h3>
              </div>
            </div>
          </section>

          <section class="table-section closed-table-section" aria-labelledby="closed-table-title">
            <div class="table-section-heading">
              <h3 id="closed-table-title" class="table-section-title">已結案</h3>
              <span id="closed-table-count" class="result-count"></span>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th class="status-column" data-sort-column="status"><button class="sort-button" data-sort-key="status" type="button">狀態 <span class="sort-indicator" aria-hidden="true"></span></button></th>
                    <th class="service-count-column" data-sort-column="serviceCount"><button class="sort-button" data-sort-key="serviceCount" type="button">服務人數 <span class="sort-indicator" aria-hidden="true"></span></button></th>
                    <th class="computer-count-column" data-sort-column="computerCount"><button class="sort-button" data-sort-key="computerCount" type="button">電腦數 <span class="sort-indicator" aria-hidden="true"></span></button></th>
                    <th class="colleague-column" data-sort-column="colleague"><button class="sort-button" data-sort-key="colleague" type="button">同仁 <span class="sort-indicator" aria-hidden="true"></span></button></th>
                    <th data-sort-column="department"><button class="sort-button" data-sort-key="department" type="button">需求者系所 <span class="sort-indicator" aria-hidden="true"></span></button></th>
                    <th class="title-column" data-sort-column="title"><button class="sort-button" data-sort-key="title" type="button">標題 <span class="sort-indicator" aria-hidden="true"></span></button></th>
                    <th class="assignee-column" data-sort-column="assignees"><button class="sort-button" data-sort-key="assignees" type="button">承辦人 <span class="sort-indicator" aria-hidden="true"></span></button></th>
                    <th class="date-column" data-sort-column="date"><button class="sort-button" data-sort-key="date" type="button">立案日 <span class="sort-indicator" aria-hidden="true"></span></button></th>
                    <th class="date-column" data-sort-column="expectedDate"><button class="sort-button" data-sort-key="expectedDate" type="button">預完日 <span class="sort-indicator" aria-hidden="true"></span></button></th>
                    <th class="date-column" data-sort-column="closeDate"><button class="sort-button" data-sort-key="closeDate" type="button">結案日 <span class="sort-indicator" aria-hidden="true"></span></button></th>
                  </tr>
                </thead>
                <tbody id="closed-work-table-body"></tbody>
              </table>
              <div id="closed-empty-state" class="empty-state" hidden>
                <div class="empty-icon">⌕</div>
                <h3>沒有符合條件的已結案項目</h3>
              </div>
            </div>
          </section>
        </div>
        <footer class="panel-footer">
          <span><span class="privacy-dot"></span> 僅顯示公開項目</span>
        </footer>
      </section>
    </main>
    <script src="app.js" defer></script>
  </body>
</html>
